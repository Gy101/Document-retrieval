server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: doc-format-check
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:doc_format_check}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:doccheck}
    password: ${MYSQL_PASSWORD:doccheck123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      # 小于 MySQL wait_timeout，避免连接被服务端回收后仍被连接池复用
      max-lifetime: 300000
      keepalive-time: 60000
      idle-timeout: 240000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: false
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 20s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

storage:
  # local | minio（minio 为预留扩展，详见 StorageService 与 README）
  type: ${STORAGE_TYPE:local}
  local:
    root: ${STORAGE_ROOT:./data/uploads}

dsh:
  # 默认开启演示模式，无需真实密钥即可跑通全流程；接入真实 DSH 时设为 false
  mock: ${DSH_MOCK:true}
  base-url: ${DSH_BASE_URL:https://api.dsh.example.com}
  api-key: ${DSH_API_KEY:}
  model: ${DSH_MODEL:dsh-chat}
  chat-path: ${DSH_CHAT_PATH:/v1/chat/completions}
  connect-timeout-seconds: 10
  timeout-seconds: 120
  max-retries: 2
  retry-backoff-ms: 1000
  temperature: 0.1
  max-tokens: 8192
  json-mode: true
  max-prompt-chars: 120000

validation:
  # 为 true 时，本地确定性规则会与 DSH 结果合并（页面/段落/表格等硬性指标）
  local-rules-enabled: true
  max-diffs: 500
  max-paragraphs: 800
  max-runs-per-paragraph: 30
  max-table-rows: 60
  # 自定义文本检索规则：外部文件优先，不存在时回退 classpath:rules/search-rules.yml
  search-rules-file: ${SEARCH_RULES_FILE:./config/search-rules.yml}
  # 外部规则文件修改后的热加载轮询间隔（毫秒）
  search-rules-watch-ms: ${SEARCH_RULES_WATCH_MS:15000}
  upload:
    max-uncompressed-mb: ${UPLOAD_MAX_UNCOMPRESSED_MB:200}
    max-entry-mb: ${UPLOAD_MAX_ENTRY_MB:80}
    max-entries: ${UPLOAD_MAX_ENTRIES:5000}
    max-compression-ratio: ${UPLOAD_MAX_COMPRESSION_RATIO:120}

check:
  # 多实例部署时建议显式设置唯一实例 ID（如 Pod 名）；留空则使用主机名+PID+随机串
  instance-id: ${CHECK_INSTANCE_ID:${INSTANCE_ID:}}
  # 解析/模型/编排三类线程池隔离；参数同时控制并发与背压
  parse:
    core: ${CHECK_PARSE_CORE:2}
    max: ${CHECK_PARSE_MAX:4}
    queue: ${CHECK_PARSE_QUEUE:100}
  dsh:
    core: ${CHECK_DSH_CORE:2}
    max: ${CHECK_DSH_MAX:8}
    queue: ${CHECK_DSH_QUEUE:50}
  parse-timeout-seconds: ${CHECK_PARSE_TIMEOUT_SECONDS:120}
  model-timeout-seconds: ${CHECK_MODEL_TIMEOUT_SECONDS:180}
  queue:
    poll-interval-ms: ${CHECK_QUEUE_POLL_MS:1000}
    heartbeat-ms: ${CHECK_QUEUE_HEARTBEAT_MS:30000}
    max-retries: ${CHECK_QUEUE_MAX_RETRIES:2}
  watchdog:
    interval-ms: ${CHECK_WATCHDOG_INTERVAL_MS:30000}
    timeout-minutes: ${CHECK_WATCHDOG_TIMEOUT_MINUTES:15}
    batch-size: ${CHECK_WATCHDOG_BATCH_SIZE:20}

auth:
  token-ttl-hours: 8
  # 仅当 Nginx 等可信反向代理会覆盖转发头时才开启，否则客户端可伪造 IP 绕过限流。
  trust-proxy: ${AUTH_TRUST_PROXY:false}
  demo-username: ${DEMO_USERNAME:admin}
  demo-password: ${DEMO_PASSWORD:admin123}

logging:
  level:
    root: INFO
    com.doccheck: INFO
    org.apache.poi: WARN
